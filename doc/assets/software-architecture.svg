<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">发票整理软件架构图</title>
  <desc id="desc">展示界面、安全边界、主进程、业务核心和基础设施之间的关系。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#102a43" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4263eb"/>
    </marker>
    <marker id="dashArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title{font:700 28px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}
      .subtitle{font:400 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#62748a}
      .layer{font:700 15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334e68;letter-spacing:1px}
      .node{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#102a43}
      .detail{font:400 13px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#526777}
      .label{font:600 12px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#526777}
      .flow{fill:none;stroke:#4263eb;stroke-width:3;marker-end:url(#arrow)}
      .wire{fill:none;stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#dashArrow)}
    </style>
  </defs>

  <rect width="1200" height="860" fill="#f6f8fc"/>
  <text x="55" y="45" class="title">发票整理软件架构</text>
  <text x="55" y="70" class="subtitle">界面通过安全 IPC 调用应用用例，业务核心不依赖具体文件、PDF、Excel 或 ZIP 库</text>

  <rect x="45" y="95" width="1110" height="145" rx="16" fill="#eef4ff" stroke="#b6ccfe" stroke-width="2"/>
  <text x="68" y="124" class="layer">界面与安全边界</text>
  <rect x="130" y="145" width="360" height="70" rx="13" fill="#fff" stroke="#74a2ff" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="174" text-anchor="middle" class="node">现代桌面界面</text>
  <text x="310" y="198" text-anchor="middle" class="detail">React · Fluent UI · 可编辑明细表</text>
  <rect x="710" y="145" width="360" height="70" rx="13" fill="#fff" stroke="#74a2ff" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="174" text-anchor="middle" class="node">最小权限接口</text>
  <text x="890" y="198" text-anchor="middle" class="detail">Typed Preload API · 参数校验</text>
  <path d="M490 180H710" class="flow"/>
  <text x="565" y="166" class="label">安全调用</text>

  <rect x="45" y="265" width="1110" height="190" rx="16" fill="#f5f0ff" stroke="#d0bfff" stroke-width="2"/>
  <text x="68" y="294" class="layer">ELECTRON 主进程</text>
  <rect x="120" y="330" width="270" height="75" rx="13" fill="#fff" stroke="#9775fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="255" y="361" text-anchor="middle" class="node">IPC 处理器</text>
  <text x="255" y="385" text-anchor="middle" class="detail">白名单通道 · Sender 校验</text>
  <rect x="465" y="330" width="300" height="75" rx="13" fill="#fff" stroke="#9775fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="361" text-anchor="middle" class="node">应用用例</text>
  <text x="615" y="385" text-anchor="middle" class="detail">导入 · 保存 · 核算 · 导出</text>
  <rect x="850" y="330" width="250" height="75" rx="13" fill="#fff9db" stroke="#f59f00" stroke-width="2" filter="url(#shadow)"/>
  <text x="975" y="361" text-anchor="middle" class="node">依赖组装</text>
  <text x="975" y="385" text-anchor="middle" class="detail">Composition Root</text>
  <path d="M890 215V255H255V330" class="flow"/>
  <path d="M390 368H465" class="flow"/>
  <path d="M850 349H810V315H255V330" class="wire"/>
  <text x="785" y="308" text-anchor="end" class="label">注册处理器</text>

  <rect x="45" y="480" width="1110" height="145" rx="16" fill="#edfff5" stroke="#8ce99a" stroke-width="2"/>
  <text x="68" y="509" class="layer">业务核心</text>
  <rect x="185" y="535" width="330" height="65" rx="13" fill="#fff" stroke="#40c057" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="562" text-anchor="middle" class="node">领域规则</text>
  <text x="350" y="584" text-anchor="middle" class="detail">金额 · 分摊 · 匹配 · 汇总</text>
  <rect x="685" y="535" width="330" height="65" rx="13" fill="#fff" stroke="#40c057" stroke-width="2" filter="url(#shadow)"/>
  <text x="850" y="562" text-anchor="middle" class="node">能力端口</text>
  <text x="850" y="584" text-anchor="middle" class="detail">File · PDF · Excel · ZIP</text>
  <path d="M565 405V445H350V535" class="flow"/>
  <path d="M665 405V445H850V535" class="flow"/>

  <rect x="45" y="650" width="1110" height="145" rx="16" fill="#fff8e8" stroke="#ffd43b" stroke-width="2"/>
  <text x="68" y="679" class="layer">基础设施适配器</text>
  <rect x="80" y="710" width="240" height="60" rx="12" fill="#fff" stroke="#fab005" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="736" text-anchor="middle" class="node">项目文件</text>
  <text x="200" y="757" text-anchor="middle" class="detail">JSON · 附件 · 原子保存</text>
  <rect x="345" y="710" width="240" height="60" rx="12" fill="#fff" stroke="#fab005" stroke-width="2" filter="url(#shadow)"/>
  <text x="465" y="736" text-anchor="middle" class="node">PDF.js</text>
  <text x="465" y="757" text-anchor="middle" class="detail">预览 · 文本层提取</text>
  <rect x="610" y="710" width="240" height="60" rx="12" fill="#fff" stroke="#fab005" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="736" text-anchor="middle" class="node">ExcelJS</text>
  <text x="730" y="757" text-anchor="middle" class="detail">明细表 · 样式 · 公式</text>
  <rect x="875" y="710" width="240" height="60" rx="12" fill="#fff" stroke="#fab005" stroke-width="2" filter="url(#shadow)"/>
  <text x="995" y="736" text-anchor="middle" class="node">Archiver</text>
  <text x="995" y="757" text-anchor="middle" class="detail">流式 ZIP 导出</text>
  <path d="M200 710V670H800V600" class="wire"/>
  <path d="M465 710V680H820V600" class="wire"/>
  <path d="M730 710V690H840V600" class="wire"/>
  <path d="M995 710V670H880V600" class="wire"/>
  <text x="560" y="665" class="label">实现端口</text>
  <path d="M975 405V640" class="wire"/>
  <text x="988" y="530" class="label">组装适配器</text>

  <line x1="70" y1="826" x2="110" y2="826" stroke="#4263eb" stroke-width="3"/>
  <text x="120" y="831" class="subtitle">调用与依赖</text>
  <line x1="245" y1="826" x2="285" y2="826" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text x="295" y="831" class="subtitle">端口实现或依赖组装</text>
</svg>
